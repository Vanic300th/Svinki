 const screens=[...root.querySelectorAll('.sv-screen')];
 const saved=window.openai?.widgetState?.privateContent||{};
 const design={accent:saved.accent||'#e8b4c1',motion:saved.motion??true,hover:saved.hover||1.07};
 const options={Голова:[['Причёска',['Шторы','Дреды','Зачёс назад','Ирокез']],['Глаза',['Обычные','Вылупившиеся','Прищур']],['Брови',['Спокойные','Густые','Монобровь']]],Тело:[['Цвет кожи',['Пудровый','Кремовый','Персиковый','Графитовый']],['Узор',['Без узора','Точки','Леопард','Звёздочки']],['Татуировка',['Нет','Звезда','Сердце']]],Аксессуары:[['Очки',['Нет','Сердечки','Круглые','Пиксельные']],['Пирсинг',['Нет','Ухо','Нос','Бровь']],['Усы',['Нет','Густые','С закрутом']]]};
 const indices={};
 function remember(screen,action){window.openai?.setWidgetState?.({modelContent:{concept:screen.dataset.design,view:action},privateContent:design})?.catch(()=>{});}
 function icons(){globalThis.lucide?.createIcons({attrs:{width:18,height:18}})}
 function open(screen,template){const layer=screen.querySelector('.sv-layer');layer.replaceChildren(root.querySelector(template).content.cloneNode(true));layer.hidden=false;screen.querySelector('.sv-menu').inert=true;icons();layer.querySelector('button')?.focus();}
 function close(screen){if(screen.dataset.returnTo==='lobby'){delete screen.dataset.returnTo;open(screen,'#sv-lobby-template');return;}screen.querySelector('.sv-layer').hidden=true;screen.querySelector('.sv-menu').inert=false;screen.querySelector('[data-action=play]').focus();}
 function choices(screen,cat){const parent=screen.querySelector('.sv-options');parent.replaceChildren();for(const [label,values]of options[cat]){const key=screen.dataset.design+label;indices[key]??=0;const row=document.createElement('div');row.className='sv-choice';row.innerHTML='<small>'+label+'</small><div class="sv-cycle"><button class="sv-arrow cursor-interaction" aria-label="Предыдущий вариант"><i data-lucide="chevron-left" aria-hidden="true"></i></button><span aria-live="polite"></span><button class="sv-arrow cursor-interaction" aria-label="Следующий вариант"><i data-lucide="chevron-right" aria-hidden="true"></i></button></div>';const text=row.querySelector('.sv-cycle span');text.textContent=values[indices[key]];row.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{indices[key]=(indices[key]+(i?1:-1)+values.length)%values.length;text.textContent=values[indices[key]];});parent.append(row);}const small=document.createElement('small');small.textContent=cat==='Голова'?'Цвет волос':'Цвет';small.style.cssText='display:block;font-size:12px;margin:14px 0 5px;color:var(--sv-dim)';parent.append(small);const swatches=document.createElement('div');swatches.className='sv-swatches';for(const [i,c]of ['#38313d','#b6a289','#ad7765','#c99bae','#d9c9a9'].entries()){const b=document.createElement('button');b.className='sv-swatch cursor-interaction';b.setAttribute('aria-label',['Тёмный','Песочный','Медный','Пыльная роза','Кремовый'][i]);b.setAttribute('aria-pressed',String(i===0));b.style.setProperty('--swatch',c);b.onclick=()=>{swatches.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));};swatches.append(b);}parent.append(swatches);icons();}
 for(const screen of screens){
  if(screen.classList.contains('hover-mode'))for(const button of screen.querySelectorAll('.sv-action')){button.setAttribute('aria-label',button.textContent.trim());const label=document.createElement('span');label.className='sv-button-label';for(const node of [...button.childNodes]){if(node.nodeType===Node.TEXT_NODE){const word=document.createElement('span');word.className='sv-word';word.textContent=node.textContent;label.append(word);node.remove();}else label.append(node);}const walker=document.createTreeWalker(label,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(const node of nodes){if(!/[оОoO]/.test(node.textContent))continue;const fragment=document.createDocumentFragment();for(const part of node.textContent.split(/([оОoO])/)){if(!part)continue;if(/[оОoO]/.test(part)&&part.length===1){const letter=document.createElement('span');letter.className='sv-o-letter';const glyph=document.createElement('span');glyph.className='sv-o-glyph';glyph.textContent=part;const nose=document.createElement('span');nose.className='sv-o-snout';nose.textContent=part;nose.setAttribute('aria-hidden','true');letter.append(glyph,nose);fragment.append(letter);}else fragment.append(document.createTextNode(part));}node.replaceWith(fragment);}for(const side of ['left','right']){const ear=document.createElement('span');ear.className='sv-text-ear '+side;ear.setAttribute('aria-hidden','true');label.append(ear);}button.append(label);}
  if(screen.classList.contains('pig-mode'))for(const button of screen.querySelectorAll('.sv-action')){const pig=document.createElement('span');pig.setAttribute('aria-hidden','true');pig.className='sv-pig-head';pig.innerHTML='<span class="sv-pig-ear"></span><span class="sv-pig-eye"></span><span class="sv-pig-cheek"></span><span class="sv-pig-snout"><b></b><b></b></span>';button.prepend(pig);for(const name of ['sv-pig-tail','sv-pig-leg left','sv-pig-leg right']){const e=document.createElement('span');e.setAttribute('aria-hidden','true');e.className=name;button.append(e);}}
  screen.addEventListener('click',event=>{const code=event.target.closest('.sv-code');if(code){const selection=window.getSelection();const range=document.createRange();range.selectNodeContents(code.querySelector('strong'));selection.removeAllRanges();selection.addRange(range);code.querySelector('small').textContent='КОД ВЫДЕЛЕН';return;}const action=event.target.closest('[data-action]')?.dataset.action;const cat=event.target.closest('[data-cat]');if(cat){screen.querySelectorAll('[data-cat]').forEach(b=>b.classList.toggle('is-active',b===cat));choices(screen,cat.dataset.cat);return;}
   if(event.target===screen.querySelector('.sv-layer')){close(screen);return;}
   if(!action)return;
   if(action==='close'){close(screen);return;}
   if(action==='customize'){if(screen.querySelector('.sv-layer:not([hidden]) .sv-lobby'))screen.dataset.returnTo='lobby';open(screen,'#sv-custom-template');choices(screen,'Голова');}
   if(action==='play')open(screen,'#sv-play-template');
   if(action==='lobby'||action==='join'){open(screen,'#sv-lobby-template');if(action==='join'){screen.querySelector('.sv-code strong').textContent='SV4K29';}}
   if(action==='ready'){const b=event.target.closest('button');b.textContent=b.textContent==='Готов'?'Готов ✓':'Готов';}
   if(action==='settings'||action==='guide'||action==='solo'||action==='exit'){const layer=screen.querySelector('.sv-layer');layer.innerHTML='<div class="sv-dialog sv-mini-dialog" role="dialog" aria-modal="true"><div class="sv-dialog-head"><h2>'+({settings:'Настройки',guide:'Как играть',solo:'Одиночная игра',exit:'Выйти?'}[action])+'</h2><button class="sv-close cursor-interaction" data-action="close" aria-label="Закрыть"><i data-lucide="x"></i></button></div>'+ (action==='settings'?'<label class="sv-setting-row">Музыка <input aria-label="Громкость музыки" type="range" value="35"></label><label class="sv-setting-row">Звуки <input aria-label="Громкость звуков" type="range" value="70"></label>': '<p class="sv-notice">'+({guide:'Собирайте вещи, примеряйте образы и удивляйте друзей.',solo:'Твоя свинка готова к приключениям.',exit:'Покинуть раздевалку?'}[action])+'</p>')+'<button class="sv-solid sv-done cursor-interaction" data-action="close">'+(action==='exit'?'Остаться':'Назад')+'</button></div>';layer.hidden=false;screen.querySelector('.sv-menu').inert=true;icons();}
   remember(screen,action);
  });
  screen.addEventListener('click',event=>{const turn=event.target.closest('[data-turn]');if(turn){const avatar=screen.querySelector('.sv-avatar');avatar.style.transform='perspective(400px) rotateY('+(Number(turn.dataset.turn)*18)+'deg)';}});
  screen.addEventListener('keydown',event=>{if(event.key==='Escape')close(screen);});
 }
 function render(){for(const screen of screens){screen.style.setProperty('--sv-pink',design.accent);screen.querySelector('.sv-bg').style.animationPlayState=design.motion?'running':'paused';for(const b of screen.querySelectorAll('.sv-action')){b.onpointerenter=()=>b.style.transform='scale('+design.hover+')';b.onpointerleave=()=>b.style.transform='';}}}
 window.addEventListener('openai:set_globals',event=>{const state=event.detail?.globals?.widgetState?.privateContent;if(state){Object.assign(design,state);render();}});
 render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addColorPicker(design,'accent',{label:'Акцент',reference:'--sv-pink'});tweak.addToggle(design,'motion',{label:'Движение фона'});tweak.addSlider(design,'hover',{label:'Увеличение при наведении',min:1.02,max:1.12,step:.01});}
})();
</script>
