<!doctype html><html><head><meta charset="utf-8"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{width:100%;height:100%;margin:0;background:#111;overflow:hidden}#player{width:100%;height:calc(100% - 32px)}#enable{display:block;width:100%;height:32px;border:0;background:#232929;color:white;cursor:pointer}#message{position:absolute;inset:0;display:grid;place-items:center;color:white;font:18px sans-serif}</style></head><body><div id="message">Loading YouTube…</div><div id="player"></div><button id="enable" type="button">CLICK TO PLAY</button><script>
'use strict';
let player,ready=false,suppressUntil=0,error=0,autoplayBlocked=false,lastTime=null,lastAt=0,lastState=-1;
const settings=JSON.parse('__CONFIG__');
document.getElementById('enable').onclick=function(){if(!ready)return;autoplayBlocked=false;window.friendslopNativeUntil=Date.now()+1500;window.friendslopEnableUntil=Date.now()+2500;if(player.getPlayerState()===1){player.pauseVideo();report(2);}else{player.playVideo();report(1);}};
function report(intent=-1){if(!window.uwb||!ready)return;const now=Date.now(),time=player.getCurrentTime(),state=player.getPlayerState();if(now<(window.friendslopNativeUntil||0)&&now>(window.friendslopEnableUntil||0)&&lastTime!==null&&Math.abs(time-lastTime-(lastState===1?(now-lastAt)/1000:0))>2)intent=3;lastTime=time;lastAt=now;lastState=state;document.getElementById('enable').textContent=state===1?'PAUSE':'CLICK TO PLAY';uwb.ExecuteJsMethod('FriendslopMedia',JSON.stringify({version:settings.version,duration:player.getDuration(),time,state,error:error,blocked:autoplayBlocked,intent:intent}));}
window.friendslopSync=function(position,playing,volume,visible){if(!ready)return;if(autoplayBlocked&&playing&&visible)return;if(Date.now()<(window.friendslopNativeUntil||0))return;const wanted=playing&&visible;suppressUntil=Date.now()+800;player.setVolume(Math.round(volume*100));if(wanted){if(Math.abs(player.getCurrentTime()-position)>1.2)player.seekTo(position,true);if(player.getPlayerState()!==1&&player.getPlayerState()!==3)player.playVideo();}else if(player.getPlayerState()===1)player.pauseVideo();};
function onYouTubeIframeAPIReady(){player=new YT.Player('player',{width:'100%',height:'100%',videoId:settings.id,playerVars:{playsinline:1,controls:1,autoplay:0,origin:location.origin,widget_referrer:settings.referrer},events:{onReady:function(){ready=true;document.getElementById('message').remove();report();},onError:function(e){error=e.data;report();},onAutoplayBlocked:function(){autoplayBlocked=true;report();},onStateChange:function(e){if(e.data===1)autoplayBlocked=false;report((Date.now()>suppressUntil||Date.now()<(window.friendslopNativeUntil||0))&&(e.data===1||e.data===2)?e.data:-1);}}});}
const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';document.head.appendChild(script);
setInterval(function(){if(ready)report();},500);
</script></body></html>
